<div class="container mt-4">
  <div>
    <h2>Modify the game :</h2>
  </div>
  <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Game</label>
      <input readonly type="text" [(ngModel)]="currentGame.idgame" name="idgame" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nom Game</label>
      <input type="text" [(ngModel)]="currentGame.gamename" name="gamename" class="form-control">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Prix Game</label>
      <input type="number" [(ngModel)]="currentGame.gameprice" name="gameprice" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date création</label>
      <input type="date" [ngModel]="currentGame.creationdate | date: 'yyyy-MM-dd'"
             (ngModelChange)="currentGame.creationdate = $event" name="creationdate" class="form-control">
    </div>

    <div class="form-group">
      <label>Calassification</label>
      <select class="form-control form-control-lg" id="idClass" name="idClass" [(ngModel)]="updatedClassId">
        @for (cls of classifications; track cls.idClass) {
          <option [value]="cls.idClass"> {{cls.nomClass}} </option>
        }
      </select>
    </div>

    <div class="mt-2">
      <button type="submit" (click)="updateGame()" class="btn btn-success">Modify</button>
    </div>
  </form>
</div>
