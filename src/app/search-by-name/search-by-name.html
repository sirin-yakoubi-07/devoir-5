<div class="container mt-4">
  <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
    <label>Search by name</label>
    <input type="text" class="form-control" name="gamename" placeholder="Game name"
           [ngModel]="gamename" (ngModelChange)="rechercherGames($event)">
  </div>

  <div class="card">
    <div class="card-body">
      <h2>Games found: {{games.length}}</h2>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Price</th>
            <th>Creation Date</th>
            <th>Classification</th>
          </tr>
        </thead>
        <tbody>
          @for (game of games; track game.idgame) {
            <tr>
              <td>{{game.idgame}}</td>
              <td>{{game.gamename}}</td>
              <td>{{game.gameprice}}</td>
              <td>{{game.creationdate | date}}</td>
              <td>{{game.classification?.nomClass}}</td>
            </tr>
          } @empty {
            <tr><td colspan="5">No games found.</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
